{% extends "layout.html" %}

{% block content %}

<section class="form-section">

    <div class="page-heading">
        <h1>Diabetes Risk Prediction</h1>
        <p>
            Enter patient health information to analyze diabetes risk using
            a trained machine learning model.
        </p>
    </div>

    <div class="form-style-3">

        <form action="{{ url_for('predictdiabetes') }}" method="post">

            <div class="input-group">

                <label>
                    <span>Pregnancies</span>
                    <input type="number" name="field1" required>
                </label>

                <label>
                    <span>Glucose Level</span>
                    <input type="number" name="field2" required>
                </label>

                <label>
                    <span>Blood Pressure</span>
                    <input type="number" name="field3" required>
                </label>

                <label>
                    <span>Skin Thickness</span>
                    <input type="number" name="field4" required>
                </label>

                <label>
                    <span>Insulin Level</span>
                    <input type="number" name="field5" required>
                </label>

                <label>
                    <span>BMI</span>
                    <input type="number" step="any" name="field6" required>
                </label>

                <label>
                    <span>Diabetes Pedigree Function</span>
                    <input type="number" step="any" name="field7" required>
                </label>

                <label>
                    <span>Age</span>
                    <input type="number" name="field8" required>
                </label>

            </div>

            <div style="text-align:center;">
                <input type="submit" value="Analyze Risk">
            </div>

        </form>

        {% if output_text %}
        <div class="result-box">
            {{ output_text }}
        </div>
        {% endif %}

    </div>

</section>

{% endblock %}
